# The package NAME must be `xkbcommon`: cargo's `[patch.crates-io]` matches on
# package name, and that is the whole mechanism by which this replaces the FFI
# binding without smithay being modified at all. The directory is named for
# what it actually is.
[package]
name = "xkbcommon"
# ★ NOT PUBLISHED, and this one is a hazard rather than a preference. This
# crate exists only as the [patch.crates-io] stand-in for the real
# `xkbcommon` (rust-x-bindings/xkbcommon-rs, 0.9.0). Uploading it under that
# name would be hijacking a live upstream crate. It has been passing only
# because the publisher matched the FOREIGN crate and logged "already
# published — treating as success": a false green against someone else's
# package.
publish = false
version = "0.8.0"
edition = "2024"
license = "MIT"
description = "Pure-Rust xkbcommon API surface, backed by hairetsu"

[dependencies]
hairetsu = { path = "../hairetsu" }
xkeysym = "0.2"

[features]
# The real crate gates these; consumers name them, so they must exist.
# Neither changes behaviour here — there is no C library to link either way.
default = ["wayland"]
wayland = []
x11 = []
