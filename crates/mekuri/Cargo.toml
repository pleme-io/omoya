[package]
name = "mekuri"
version = "0.1.0"
edition = "2024"
rust-version = "1.89.0"
description = "Mekuri (めくり) — zero-dependency page-turn decision: is a frame owed, and the permission to draw it"
homepage = "https://github.com/pleme-io/mekuri"
repository = "https://github.com/pleme-io/mekuri"
license = "MIT"
categories = ["rendering", "graphics", "concurrency"]
keywords = ["damage", "redraw", "frame", "compositor", "vsync"]

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"

# NOTE: no [profile.release] here. Cargo ignores profiles on a non-root
# workspace member and warns about it; the workspace root owns them. The
# section returns when this crate moves to its own repo
# (pending-mekuri-extraction) and becomes a root again.
