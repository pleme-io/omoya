[package]
name = "mekuri"
version = "0.1.0"
edition = "2024"
rust-version = "1.89.0"
description = "Mekuri (めくり) — zero-dependency page-turn decision: is a frame owed, and the permission to draw it"
homepage = "https://github.com/pleme-io/mekuri"
repository = "https://github.com/pleme-io/mekuri"
license = "MIT"
categories = ["rendering", "graphics", "concurrency"]
keywords = ["damage", "redraw", "frame", "compositor", "vsync"]

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
