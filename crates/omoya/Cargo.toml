[package]
name = "omoya"
description = "omoya (母屋) — the pleme-io-native Wayland compositor"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "omoya"
path = "src/main.rs"

# ── ★ WHY `nested` IS OFF BY DEFAULT ──────────────────────────────────────
# The nested (winit) backend is a development convenience: it composites into
# a window on an existing session so renderer and input work can be exercised
# without a seat. It is NOT part of the shipped compositor.
#
# It is gated because winit pulls `xkbcommon-dl`, which **`dlopen`s
# libxkbcommon at runtime**. A dlopen is invisible to `ldd` — so a binary
# carrying winit would report a clean library census while loading the exact C
# library this tree replaced. That is the same shape as `ash` dlopening
# libvulkan, and it makes the census lie in the flattering direction, which is
# worse than an honest link.
#
# Turning this on is fine for local work; it must not be on in what ships.
[features]
default = []
nested = ["smithay/backend_winit"]

[dependencies]
# The frame-necessity decision. Its own repo and its own crate as of
# 2026-08-21 — it lived at `crates/mekuri` for exactly as long as it took to
# unpark the shard that owns it, because `gen` refuses a sibling path dep
# (substrate's nix lockfile-builder cannot see a sibling repo in the sandbox).
mekuri = "0.1.0"
omoya-spec = { path = "../omoya-spec", version = "0.1.0" }
# The palette. NOT a hex literal in this crate — `irodori::NORD` is where Nord
# is BORN in this fleet (ishou-tokens itself reads it), so the compositor's
# clear colour is a projection of the fleet theme rather than a second copy of
# it. theory/THEME-ARCHITECTURE.md is the rule this obeys.
irodori = "0.2"
# The chord catalog. `Reserved::fleet_linux()` is what stops omoya swallowing
# Ctrl+Alt+F1..F12 and soft-bricking the machine — see awase@ce7a52b.
awase = "0.1.10"
# The fleet introspection sidecar — a shipped library (published 0.1.6,
# ~1500 lines, 27 tests) already consumed BY VERSION by mado, tear and
# frost. Adopted rather than re-rolled: writing a fresh Unix socket here
# would start by reinventing the bug kanshou exists to prevent, where mado
# once reported frame_perf 0 over MCP while its GUI rendered at 120fps
# because the server had no wire into the live process.
kanshou = "0.1"
# fontdue — pure-Rust glyph rasterization for the status bar. No C, no
# FreeType: consistent with the seat's whole point, and the bar is the first
# thing on the CPU path that needs actual text. Deliberately NOT added to
# nuri, whose header states it has zero dependencies.
fontdue = "0.9"
# kukaku (区画) — the split-tree layout algebra. Extracted from tear-types
# when omoya became its third consumer (tear's panes, mado's planned rebase,
# and this): the algebra used only "an id copies and two compare", so the id
# became a type parameter and the crate stopped belonging to a multiplexer.
# Its 49 tests are tear's own cases run against a leaf id it invented, which
# is the evidence the extraction was sound rather than a rename.
#
# ★ A GIT DEP, NOT A VERSION, AND THAT IS A KNOWN INTERIM. `kukaku` is not on
# crates.io because tear's GitHub Actions are DECLARED off in
# pangea-architectures' org.yaml (`actions_enabled: false`, a deliberate
# CI-cost posture on 14 of ~860 records), so ★★ AUTO-RELEASE cannot publish
# it and no automated path can. Pinned by rev rather than branch so this
# repo's build is reproducible while that holds.
# `pending-kukaku-publish: crates.io, gated on tear's actions_enabled`
kukaku = { git = "https://github.com/pleme-io/tear", rev = "8b270155535015531396626022b8d31ddc35455b" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
# ── ★ D-Bus, pure Rust ────────────────────────────────────────────────────
# zbus implements the protocol itself rather than binding libdbus, so speaking
# logind costs no `.so` — which is the entire reason this replaces libseat
# instead of wrapping it. Same pin as mukae-native, deliberately: two crates
# speaking one bus should not drift on the client.
zbus = { version = "5", default-features = false, features = ["blocking-api", "tokio"] }
zvariant = "5"
# ── ★ INPUT, STRAIGHT FROM THE KERNEL ─────────────────────────────────────
# Pure Rust: bitvec, cfg-if, libc, nix — NO -sys crate, no libevdev. Replaces
# libinput.so.10 and libudev.so.1, neither of which computes anything the
# kernel does not already provide through /dev/input and /sys.
evdev = "0.13"
# The pleme-io software rasterizer — zero dependencies, replaces libpixman.
nuri = { path = "../nuri", version = "0.1.0" }
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dependencies.smithay]
version = "0.7"
default-features = false
features = [
  # `backend_winit` is NOT here — it arrives only through omoya's own
  # `nested` feature, which is off by default. See the note above [features].
  "wayland_frontend",
  "desktop",
  # M4a: the DRM/KMS scanout path. `renderer_pixman` is the software
  # renderer OMOYA.md §5a chose FIRST — no GPU, no dmabuf, no unsafe —
  # and on plo it is currently the ONLY path that works, since simpledrm
  # owns the display until the nvidia stage is armed.
  "backend_drm",
  # ★ REQUIRED for DrmCompositor, and this corrects a claim made twice in
  # this repo's own comments. smithay gates the module:
  #   #[cfg(all(feature = "wayland_frontend", feature = "backend_gbm"))]
  #   pub mod compositor;
  # so "the dumb-buffer path needs no gbm" is true of the RUNTIME path —
  # no GbmDevice is ever constructed, the slot is passed None — and false
  # of the COMPILE-TIME gate. Without this feature DrmCompositor does not
  # exist to call.
  # ★ backend_gbm REMOVED — it linked libgbm.so.1 to satisfy a compile-time
  # gate on `DrmCompositor`, which no GbmDevice ever backed. The runtime path
  # was always dumb buffers. `crate::scanout::DirectScanout` drives DrmSurface
  # page flips directly, so the gate is no longer needed and neither is the
  # library.
  # M4c: input. The HANDLER already exists (input.rs, written for M2) —
  # this only supplies the events. `backend_session_libseat` comes with
  # it because libinput must open /dev/input/* , and doing that without a
  # session means running the whole compositor as root.
  # ★ REQUIRED for `Libinput::new_with_udev`. smithay gates it as
  #   backend_udev = [ "udev", "input/udev" ]
  # so `backend_libinput` alone pulls in the `input` crate WITHOUT its
  # udev feature, and the udev constructor is compiled out. The error is
  # "no associated function named new_with_udev", which reads like the
  # method does not exist — while the crate's own docs use it, because
  # their doctest builds with the feature on.
  # ★ backend_session_libseat REMOVED — it linked libseat.so.1. `crate::logind`
  # speaks org.freedesktop.login1 over zbus instead, which is pure Rust.
  #
  # `backend_session` (no libseat) stays: it is what defines the `Session`
  # TRAIT our own impl satisfies, and it pulls nothing.
  "backend_session",
  # ★ `renderer_pixman` REMOVED. `nuri` is the renderer now: it implements
  # Renderer, Frame, ImportMem/ImportMemWl, ImportDma/ImportDmaWl, Bind<Dmabuf>
  # and ExportMem, and nothing in this crate names PixmanRenderer any more.
  #
  # The feature is what LINKED libpixman-1.so.0. Flipping the default made nuri
  # RUN; removing the feature is what removes the library — `ldd` is the only
  # thing that settles which of those happened.
  #
  # `--renderer pixman` is therefore gone too, and that is the honest
  # consequence rather than an oversight: a flag that selects a renderer the
  # build no longer contains would be a lie in the help text.
]
