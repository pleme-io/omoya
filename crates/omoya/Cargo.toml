[package]
name = "omoya"
description = "omoya (母屋) — the pleme-io-native Wayland compositor"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "omoya"
path = "src/main.rs"

[dependencies]
omoya-spec = { path = "../omoya-spec", version = "0.1.0" }
# The palette. NOT a hex literal in this crate — `irodori::NORD` is where Nord
# is BORN in this fleet (ishou-tokens itself reads it), so the compositor's
# clear colour is a projection of the fleet theme rather than a second copy of
# it. theory/THEME-ARCHITECTURE.md is the rule this obeys.
irodori = "0.2"
# The chord catalog. `Reserved::fleet_linux()` is what stops omoya swallowing
# Ctrl+Alt+F1..F12 and soft-bricking the machine — see awase@ce7a52b.
awase = "0.1.10"
# The fleet introspection sidecar — a shipped library (published 0.1.6,
# ~1500 lines, 27 tests) already consumed BY VERSION by mado, tear and
# frost. Adopted rather than re-rolled: writing a fresh Unix socket here
# would start by reinventing the bug kanshou exists to prevent, where mado
# once reported frame_perf 0 over MCP while its GUI rendered at 120fps
# because the server had no wire into the live process.
kanshou = "0.1"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
# ── ★ D-Bus, pure Rust ────────────────────────────────────────────────────
# zbus implements the protocol itself rather than binding libdbus, so speaking
# logind costs no `.so` — which is the entire reason this replaces libseat
# instead of wrapping it. Same pin as mukae-native, deliberately: two crates
# speaking one bus should not drift on the client.
zbus = { version = "5", default-features = false, features = ["blocking-api", "tokio"] }
zvariant = "5"
# ── ★ INPUT, STRAIGHT FROM THE KERNEL ─────────────────────────────────────
# Pure Rust: bitvec, cfg-if, libc, nix — NO -sys crate, no libevdev. Replaces
# libinput.so.10 and libudev.so.1, neither of which computes anything the
# kernel does not already provide through /dev/input and /sys.
evdev = "0.13"
# The pleme-io software rasterizer — zero dependencies, replaces libpixman.
nuri = { path = "../nuri", version = "0.1.0" }
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dependencies.smithay]
version = "0.7"
default-features = false
features = [
  "backend_winit",
  "wayland_frontend",
  "desktop",
  # M4a: the DRM/KMS scanout path. `renderer_pixman` is the software
  # renderer OMOYA.md §5a chose FIRST — no GPU, no dmabuf, no unsafe —
  # and on plo it is currently the ONLY path that works, since simpledrm
  # owns the display until the nvidia stage is armed.
  "backend_drm",
  # ★ REQUIRED for DrmCompositor, and this corrects a claim made twice in
  # this repo's own comments. smithay gates the module:
  #   #[cfg(all(feature = "wayland_frontend", feature = "backend_gbm"))]
  #   pub mod compositor;
  # so "the dumb-buffer path needs no gbm" is true of the RUNTIME path —
  # no GbmDevice is ever constructed, the slot is passed None — and false
  # of the COMPILE-TIME gate. Without this feature DrmCompositor does not
  # exist to call.
  "backend_gbm",
  # M4c: input. The HANDLER already exists (input.rs, written for M2) —
  # this only supplies the events. `backend_session_libseat` comes with
  # it because libinput must open /dev/input/* , and doing that without a
  # session means running the whole compositor as root.
  "backend_libinput",
  # ★ REQUIRED for `Libinput::new_with_udev`. smithay gates it as
  #   backend_udev = [ "udev", "input/udev" ]
  # so `backend_libinput` alone pulls in the `input` crate WITHOUT its
  # udev feature, and the udev constructor is compiled out. The error is
  # "no associated function named new_with_udev", which reads like the
  # method does not exist — while the crate's own docs use it, because
  # their doctest builds with the feature on.
  "backend_udev",
  "backend_session_libseat",
  "renderer_pixman",
]
